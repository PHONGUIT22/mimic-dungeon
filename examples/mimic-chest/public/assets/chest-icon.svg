<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="chestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glowGrad)" opacity="0.3"/>
  <!-- Chest Body -->
  <rect x="10" y="26" width="44" height="28" rx="4" fill="url(#chestGrad)" stroke="#451a03" stroke-width="2"/>
  <!-- Chest Lid -->
  <path d="M8 26 C8 16 20 12 32 12 C44 12 56 16 56 26 Z" fill="url(#chestGrad)" stroke="#451a03" stroke-width="2"/>
  <!-- Metal Bands -->
  <rect x="16" y="12" width="5" height="42" fill="url(#metalGrad)" stroke="#451a03" stroke-width="1.5"/>
  <rect x="43" y="12" width="5" height="42" fill="url(#metalGrad)" stroke="#451a03" stroke-width="1.5"/>
  <!-- Keyhole Plate -->
  <rect x="27" y="24" width="10" height="12" rx="2" fill="url(#metalGrad)" stroke="#451a03" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="2" fill="#451a03"/>
  <polygon points="31,29 33,29 32.5,33 31.5,33" fill="#451a03"/>
  <!-- Glowing eye hint (Mimic lore) -->
  <circle cx="20" cy="22" r="1.5" fill="#ef4444"/>
  <circle cx="44" cy="22" r="1.5" fill="#ef4444"/>
</svg>
