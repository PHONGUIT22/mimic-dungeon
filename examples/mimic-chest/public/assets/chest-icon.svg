<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="arcanaBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b1d6e"/>
      <stop offset="60%" stop-color="#1e1338"/>
      <stop offset="100%" stop-color="#0e071c"/>
    </radialGradient>
    <linearGradient id="goldBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sigilCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="7" y="3" width="50" height="58" rx="6" fill="#c084fc" opacity="0.15" filter="url(#sigilGlow)"/>

  <!-- Card Body (Deep Cosmic Purple Background #1e1338) -->
  <rect x="8" y="4" width="48" height="56" rx="5" fill="url(#arcanaBgGlow)" stroke="#f59e0b" stroke-width="1.4"/>

  <!-- Inner Luxury Gold Double Border (#fbbf24) -->
  <rect x="11.5" y="7.5" width="41" height="49" rx="3" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3 1.5" opacity="0.9"/>

  <!-- 4 Corner Celestial Accents -->
  <text x="13.5" y="12" font-size="4" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
  <text x="50.5" y="12" font-size="4" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
  <text x="13.5" y="54" font-size="4" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
  <text x="50.5" y="54" font-size="4" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>

  <!-- Esoteric Glowing Aura -->
  <circle cx="32" cy="27" r="14" fill="url(#sigilCenterGlow)"/>

  <!-- Concentric Esoteric Rings (#c084fc / #fbbf24) -->
  <circle cx="32" cy="27" r="13" stroke="#c084fc" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.85"/>
  <circle cx="32" cy="27" r="9.5" stroke="#fbbf24" stroke-width="0.7" opacity="0.9"/>
  <circle cx="32" cy="27" r="6" stroke="#c084fc" stroke-width="0.5" opacity="0.7"/>

  <!-- 8-Pointed Esoteric Sacred Star Sigil (#c084fc) -->
  <g stroke="#c084fc" stroke-width="0.9" fill="none" filter="url(#sigilGlow)">
    <polygon points="32,16 34.5,24.5 43,27 34.5,29.5 32,38 29.5,29.5 21,27 29.5,24.5"/>
    <polygon points="32,18 39.8,20.2 32,27 24.2,20.2" opacity="0.6"/>
    <polygon points="32,36 39.8,33.8 32,27 24.2,33.8" opacity="0.6"/>
  </g>

  <!-- Central Star Sparkle -->
  <circle cx="32" cy="27" r="1.8" fill="#fef08a"/>
  <circle cx="32" cy="27" r="0.8" fill="#ffffff"/>

  <!-- Satellite Celestial Nodes -->
  <circle cx="32" cy="14" r="0.9" fill="#fbbf24"/>
  <circle cx="45" cy="27" r="0.9" fill="#fbbf24"/>
  <circle cx="32" cy="40" r="0.9" fill="#fbbf24"/>
  <circle cx="19" cy="27" r="0.9" fill="#fbbf24"/>

  <!-- Decorative Separator Line -->
  <line x1="16" y1="44" x2="48" y2="44" stroke="url(#goldBorderGrad)" stroke-width="0.75" opacity="0.8"/>
  <polygon points="32,43 33.5,44 32,45 30.5,44" fill="#fbbf24"/>

  <!-- Typography: ARCANA FATE -->
  <text x="32" y="49" font-family="'Rubik', -apple-system, sans-serif" font-weight="900" font-size="4.5" fill="#fef08a" text-anchor="middle" letter-spacing="1">ARCANA</text>
  <text x="32" y="53.5" font-family="'Rubik', -apple-system, sans-serif" font-weight="800" font-size="3.2" fill="#c084fc" text-anchor="middle" letter-spacing="1.2">FATE</text>
</svg>
