<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c071a"/>
      <stop offset="60%" stop-color="#190e30"/>
      <stop offset="100%" stop-color="#070310"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="cardCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>

  <!-- Mystic Portal Aura -->
  <circle cx="300" cy="135" r="150" fill="url(#portalGlow)"/>

  <!-- Rotating Esoteric Outer Ring -->
  <circle cx="300" cy="135" r="130" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="300" cy="135" r="108" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>

  <!-- Mystic Pillars -->
  <rect x="36" y="24" width="46" height="316" rx="4" fill="#171129" stroke="#372658" stroke-width="1.8"/>
  <rect x="518" y="24" width="46" height="316" rx="4" fill="#171129" stroke="#372658" stroke-width="1.8"/>

  <!-- Celestial Torches / Runes -->
  <circle cx="59" cy="95" r="12" fill="#c084fc" opacity="0.75"/>
  <circle cx="59" cy="95" r="5" fill="#fef08a"/>
  <circle cx="541" cy="95" r="12" fill="#c084fc" opacity="0.75"/>
  <circle cx="541" cy="95" r="5" fill="#fef08a"/>

  <!-- Central Arcana Tarot Card (Floating Luminous Card) -->
  <g transform="translate(245, 45)">
    <!-- Card Drop Shadow / Outer Aura -->
    <rect x="-4" y="-4" width="118" height="178" rx="10" fill="#c084fc" opacity="0.25"/>

    <!-- Card Body -->
    <rect width="110" height="170" rx="8" fill="#1a1032" stroke="url(#goldBorderGrad)" stroke-width="2.5"/>

    <!-- Inner Gold Border -->
    <rect x="7" y="7" width="96" height="156" rx="5" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.85"/>

    <!-- 4 Corner Stars -->
    <text x="12" y="17" font-size="7" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
    <text x="98" y="17" font-size="7" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
    <text x="12" y="159" font-size="7" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>
    <text x="98" y="159" font-size="7" fill="#fbbf24" text-anchor="middle" font-family="serif">✦</text>

    <!-- Glowing Center Mandala -->
    <circle cx="55" cy="85" r="42" fill="url(#cardCenterGlow)"/>
    <circle cx="55" cy="85" r="38" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="55" cy="85" r="28" stroke="#fbbf24" stroke-width="1.2"/>

    <!-- Sacred 8-Pointed Star -->
    <polygon points="55,56 61,78 84,85 61,92 55,114 49,92 26,85 49,78" fill="none" stroke="#e9d5ff" stroke-width="1.6"/>
    <circle cx="55" cy="85" r="4" fill="#fbbf24"/>

    <!-- Card Label -->
    <text x="55" y="142" font-family="'Rubik', sans-serif" font-weight="900" font-size="10" fill="#fef08a" text-anchor="middle" letter-spacing="2">ARCANA</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="265" font-family="'Rubik', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">ARCANA FATE</text>
  <text x="300" y="295" font-family="'Rubik', sans-serif" font-weight="700" font-size="12" fill="#d8b4fe" text-anchor="middle" letter-spacing="4">96.00% CERTIFIED RTP • SACRED SIGILS ON BASE L2</text>
</svg>
